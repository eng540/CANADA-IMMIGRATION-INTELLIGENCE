site_name: "دليل كندا الذكي — قاعدة معرفة الدخول والهجرة والعمل"
site_description: "قاعدة معرفة عربية موثقة عن مسارات الدخول والهجرة والعمل في كندا، مبنية على المصادر الحكومية الرسمية أولاً."
site_author: "Canada Immigration Intelligence"

# المحتوى يعيش في جذر المستودع (الأدلة الـ13) وهذا المجلد يحوي إعدادات الموقع فقط
docs_dir: ..
site_dir: ../../kb-site-build
exclude_docs: |
  site/*
  .git/*
  .github/*
  03-ALL-PROGRAMS/card-template.md

theme:
  name: material
  language: ar
  direction: rtl
  font:
    text: Noto Kufi Arabic
    code: IBM Plex Mono
  palette:
    primary: red
    accent: deep orange
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - search.highlight
    - search.suggest
    - content.action.view
    - toc.follow

plugins:
  - search:
      lang: ar
      separator: '[\s\-\.,،؛:!؟()]+'

markdown_extensions:
  - tables
  - admonition
  - toc:
      permalink: true
  - attr_list
  - md_in_html

extra_css:
  - site/assets/extra.css

nav:
  - الرئيسية: README.md
  - خريطة التغطية: 00-COVERAGE.md
  - ابدأ هنا:
    - 01-START-HERE/README.md
