    - كيف تعمل المنظومة: 01-START-HERE/how-the-system-works.md
    - المسرد: 01-START-HERE/glossary.md
    - خريطة الجهات الحكومية: 01-START-HERE/government-map.md
  - منظومة الهجرة:
    - 02-IMMIGRATION-SYSTEM/README.md
    - المهن عالية الأجر في Express Entry: 02-IMMIGRATION-SYSTEM/ee-high-wage-occupations.md
    - التدابير الخاصة بالجنسيات: 02-IMMIGRATION-SYSTEM/special-measures.md
